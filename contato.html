<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | NatArt</title>

    <!-- Biblioteca de Ícones (Font Awesome CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Link para a folha de estilos na pasta css/ -->
    <link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="png/logo.png" type="image/png">
</head>
<body>

    <!-- CABEÇALHO & NAVEGAÇÃO -->
    <header class="header-principal">
        <div class="logo-container">
            <a href="index.html" class="logo">
                <img src="png/logo.png" alt="Logo NatArt" class="logo-img">
                <span>NatArt</span>
            </a>
            <span class="logo-subtitle">Ilustração & Arte Digital</span>
        </div>

        <nav class="menu-navegacao">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="portifolio.html">Portfólio</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL (CONTATO) -->
    <main>
        <section class="contato-container">
            <form class="form-contato" action="#" method="POST">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem ou detalhes do projeto..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>

            <div class="contato-info">
                <img src="png/arte.png" alt="Ilustração de apoio contato">
            </div>
        </section>
    </main>

    <!-- RODAPÉ & INSTAGRAM -->
    <footer class="footer-principal">
        <a href="https://www.instagram.com/naty.artee" target="_blank" rel="noopener noreferrer" class="btn-instagram">
            <i class="fa-brands fa-instagram"></i>
            Siga no Instagram: @naty.artee
        </a>
        <p>&copy; 2026 NatArt. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
